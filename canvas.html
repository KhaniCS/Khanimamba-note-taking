<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Inkloom">
  <title>Inkloom Canvas</title>
  <link rel="stylesheet" href="canvas-styles.css">
  
  <script>
    function showError(msg) {
      var d = document.createElement("div");
      d.style.cssText = "position:fixed;top:0;left:0;right:0;background:red;color:white;padding:20px;font-size:16px;z-index:99999;font-family:sans-serif;word-wrap:break-word;box-shadow:0 4px 6px rgba(0,0,0,0.3);";
      d.textContent = "CRASH: " + msg;
      document.body.appendChild(d);
    }
    window.showError = showError;
    
    // Catches missing files
    window.addEventListener('error', function(e) {
      if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
        showError("Failed to load file: " + (e.target.src || e.target.href));
      } else {
        showError(e.message + " in " + (e.filename || "unknown file"));
      }
    }, true);

    // Catches database/promise crashes (Restored!)
    window.addEventListener('unhandledrejection', function(e) {
      showError("Database/Async error: " + e.reason);
    });
  </script>
</head>
<body>
  <header id="canvas-header">
    <button id="back-btn" type="button">‹ Library</button>
    <h1 id="canvas-title">Canvas</h1>
    <div style="width: 60px;"></div>
  </header>

  <!-- UPDATED TOOLBAR -->
  <div id="toolbar">
    <button id="lost-btn" class="tool-btn wide" type="button">LOST</button>
    <button id="add-node-btn" class="tool-btn wide" type="button" style="background:#34c759; color:#fff;">+ NODE</button>
    <div class="divider"></div>
    
    <div class="tool-group">
      <button class="tool-btn active" data-tool="pen" type="button">✎</button>
      <button class="tool-btn" data-tool="eraser" type="button">⌫</button>
    </div>
    <div class="divider"></div>

    <button id="rotate-lock-btn" class="tool-btn wide" type="button">ROT 🔓</button>
    <div class="divider"></div>

    <div class="size-group">
      <button class="size-btn" data-size="2" type="button">2</button>
      <button class="size-btn active" data-size="4" type="button">4</button>
      <button class="size-btn" data-size="8" type="button">8</button>
      <button class="size-btn" data-size="20" type="button">20</button>
    </div>
    <div class="divider"></div>

    <div class="color-group">
      <button class="color-btn active" data-color="#1a1a2e" style="background:#1a1a2e;" type="button"></button>
      <button class="color-btn" data-color="#ff3b30" style="background:#ff3b30;" type="button"></button>
      <button class="color-btn" data-color="#007aff" style="background:#007aff;" type="button"></button>
      <button class="color-btn" data-color="#34c759" style="background:#34c759;" type="button"></button>
      <button class="color-btn" data-color="#ff9500" style="background:#ff9500;" type="button"></button>
      <button class="color-btn" data-color="#af52de" style="background:#af52de;" type="button"></button>
    </div>
  </div>

  <div id="bottom-indicators">
    <div id="zoom-indicator">100%</div>
    <div id="rotation-indicator">0°</div>
  </div>

  <div id="canvas-wrap">
    <canvas id="draw-surface"></canvas>
    <!-- This layer holds the HTML text nodes -->
    <div id="nodes-layer"></div>
  </div>
  
  <script src="store.js"></script>
  <script src="canvas.js"></script>
</body>
</html>
