<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Inkloom">
  <title>Inkloom Canvas</title>
  <link rel="stylesheet" href="canvas-styles.css">
  
  <!-- GLOBAL ERROR CATCHER (Same as index.html) -->
  <script>
    function showError(msg) {
      var d = document.createElement("div");
      d.style.cssText = "position:fixed;top:0;left:0;right:0;background:red;color:white;padding:20px;font-size:16px;z-index:99999;font-family:sans-serif;word-wrap:break-word;box-shadow:0 4px 6px rgba(0,0,0,0.3);";
      d.textContent = "CRASH: " + msg;
      document.body.appendChild(d);
    }
    window.showError = showError;
    
    window.addEventListener('error', function(e) {
      if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
        showError("Failed to load file: " + (e.target.src || e.target.href));
      } else {
        showError(e.message + " in " + (e.filename || "unknown file"));
      }
    }, true);

    window.addEventListener('unhandledrejection', function(e) {
      showError("Database/Async error: " + e.reason);
    });
  </script>
</head>
<body>
  <header id="canvas-header">
    <button id="back-btn" type="button">‹ Library</button>
    <h1 id="canvas-title">Canvas</h1>
    <div id="canvas-actions">
      <button id="undo-btn" type="button">Undo</button>
      <button id="clear-btn" type="button" class="danger">Clear</button>
    </div>
  </header>
  <div id="canvas-wrap">
    <canvas id="draw-surface"></canvas>
  </div>
  <script src="store.js"></script>
  <script src="canvas.js"></script>
</body>
</html>
